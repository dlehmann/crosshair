name: Release AppImage

# Builds crosshair, packages it as a self-contained AppImage (bundling every
# shared library it needs - see package-appimage.sh / README.md), and
# publishes it as a GitHub release asset whenever a version tag (e.g.
# "v1.0.0") is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev \
            libcairo2-dev librsvg2-dev libyaml-cpp-dev \
            librsvg2-bin

      - name: Build and package the AppImage
        run: ./package-appimage.sh

      - name: Add version to the AppImage filename
        id: artifact
        run: |
          name="crosshair-${GITHUB_REF_NAME}-x86_64.AppImage"
          mv build/crosshair-x86_64.AppImage "build/${name}"
          echo "path=build/${name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.artifact.outputs.path }}" \
            --title "Crosshair ${GITHUB_REF_NAME}" \
            --generate-notes
