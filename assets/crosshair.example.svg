<!--
  Example custom crosshair. Copy this file next to the crosshair binary (or
  the .AppImage, for an AppImage build) and rename it to "crosshair.svg" to
  use it instead of the default crosshair the program auto-generates there
  when no crosshair.svg exists yet. See the "Usage & Operation" section of
  README.md for details.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <g stroke="#000000" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="24" y1="4"  x2="24" y2="16"/>
    <line x1="24" y1="32" x2="24" y2="44"/>
    <line x1="4"  y1="24" x2="16" y2="24"/>
    <line x1="32" y1="24" x2="44" y2="24"/>
  </g>
  <g stroke="#39ff14" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="4"  x2="24" y2="16"/>
    <line x1="24" y1="32" x2="24" y2="44"/>
    <line x1="4"  y1="24" x2="16" y2="24"/>
    <line x1="32" y1="24" x2="44" y2="24"/>
  </g>
  <circle cx="24" cy="24" r="1.6" fill="#39ff14" stroke="#000000" stroke-width="0.8"/>
</svg>
