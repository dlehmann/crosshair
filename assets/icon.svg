<!--
  Application icon. Installed by install.sh / package-appimage.sh as the
  crosshair icon theme entry (referenced by the .desktop file's Icon= and
  by the AppImage), so it is an active build artifact, not just reference
  art. The same badge design is also drawn programmatically, independent of
  this file, in src/icon.cpp for the taskbar/window icon (_NET_WM_ICON) -
  keep both in sync if this design changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1b1f27"/>
  <g stroke="#000000" stroke-width="7" stroke-linecap="round">
    <line x1="32" y1="8"  x2="32" y2="22"/>
    <line x1="32" y1="42" x2="32" y2="56"/>
    <line x1="8"  y1="32" x2="22" y2="32"/>
    <line x1="42" y1="32" x2="56" y2="32"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="8"  x2="32" y2="22"/>
    <line x1="32" y1="42" x2="32" y2="56"/>
    <line x1="8"  y1="32" x2="22" y2="32"/>
    <line x1="42" y1="32" x2="56" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
